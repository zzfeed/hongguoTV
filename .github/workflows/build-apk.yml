name: Build Android Debug APK
# 触发条件：push到main分支、PR到main，也可以手动在Actions页面点Run workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发，很重要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 配置JDK，现在新版Android Gradle推荐JDK17；老项目用11/8
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 缓存gradle，加快后续编译

      # 3. 给gradlew执行权限（ubuntu必须加，否则permission denied）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 编译debug apk
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 上传APK作为产物，编译完在Actions里下载
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # 保留7天，可以改长
