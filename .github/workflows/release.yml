name: 发布打包服务器最新版


on:
  workflow_dispatch:
    inputs:
      task_id:
        description: '构建任务 ID（留空自动选择最新成功的 APK）'
        required: false
        type: string
      notes:
        description: '发布说明（可选，默认使用构建提交说明）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tv-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: 发布已打包的签名 APK
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hongguotv-release]
    timeout-minutes: 15
    steps:
      - name: 获取发布脚本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 发布到 GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          HONGGUOTV_BUILD_TASKS_DIR: /build-data/tasks
          RELEASE_TASK_ID: ${{ inputs.task_id }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 scripts/publish-tv-release.py
