name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 下载Gradle8.2，生成wrapper
      - name: Download Gradle 8.2
        run: |
          wget https://mirrors.cloud.tencent.com/gradle/gradle-8.2-all.zip
          unzip gradle-8.2-all.zip
          export GRADLE_HOME=$PWD/gradle-8.2
          export PATH=$GRADLE_HOME/bin:$PATH
          cd kotlin-tv
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      # 阿里云全局镜像
      - name: Aliyun mirror init script
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          pluginManagement {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      # 重点：清缓存 + clean + 强制刷新依赖
      - name: Build Debug APK
        run: |
          rm -rf ~/.gradle/caches
          cd kotlin-tv
          ./gradlew clean assembleDebug --refresh-dependencies --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
