name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout升级到v7，setup-java升级v5，upload-artifact v7，解决Node20弃用警告
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 【可选】国内加速：替换gradle镜像，强烈建议加上，这个项目很容易依赖下载超时失败
      - name: 替换maven为阿里云镜像
        run: |
          sed -i 's/maven { url "https:\/\/maven.google.com" }/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/' settings.gradle
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/' settings.gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
