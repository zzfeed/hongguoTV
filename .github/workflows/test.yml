name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4 # 建议使用稳定版本 v4

      # 1. 设置 JDK 17 (AGP 8+ 和 Gradle 8+ 都需要 JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 启用 Gradle 缓存加速构建

      # 2. 不再手动下载 Gradle，而是让 gradlew 自动处理
      # 确保项目根目录下的 gradle/wrapper/gradle-wrapper.properties 中
      # distributionUrl 指向 gradle-8.9-all.zip (或 8.0+)
      # 如果本地没配置好，可以在这里强制生成 wrapper
      - name: Setup Gradle Wrapper
        run: |
          cd kotlin-tv
          # 确保 wrapper 指向 Gradle 8.x
          # 如果项目里已经是 8.x，这步可以跳过，直接运行 build
          chmod +x gradlew

      # 3. 配置阿里云镜像 (可选，加速国内访问)
      - name: Aliyun mirror init script
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          pluginManagement {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      # 4. 构建 APK
      - name: Build Debug APK
        run: |
          cd kotlin-tv
          # 不需要 --refresh-dependencies 除非你确定依赖有问题，否则会很慢
          # 不需要 rm -rf caches，这会失去缓存优势
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
