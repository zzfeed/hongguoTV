name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # JDK17 用来运行系统gradle生成wrapper
      - name: Set up JDK 17 for wrapper generate
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 进入 kotlin-tv 目录生成 wrapper
      - name: Generate Gradle Wrapper 7.5 inside kotlin-tv
        run: |
          cd kotlin-tv
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew

      # 切换JDK11编译项目
      - name: Set up JDK 11 for build
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # 阿里云全局镜像
      - name: Aliyun mirror init script
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          pluginManagement {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      # 在 kotlin-tv 目录执行打包
      - name: Build Debug APK
        run: |
          cd kotlin-tv
          ./gradlew assembleDebug --stacktrace

      # APK路径：kotlin-tv 里面的app模块输出
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
