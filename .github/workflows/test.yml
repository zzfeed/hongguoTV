name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # 第一步：JDK17 用于运行系统gradle生成wrapper
      - name: Set up JDK 17 for wrapper generate
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 【重点！修改这里的cd路径！】进入有settings.gradle的目录，生成wrapper
      - name: Generate Gradle Wrapper 7.5 inside project dir
        run: |
          cd kotlin-tv
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew

      # 切换JDK11，项目编译需要JDK11
      - name: Set up JDK 11 for build
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # 全局阿里云镜像，解决依赖拉取超时
      - name: Aliyun mirror init script
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          pluginManagement {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      # 编译，同样cd进入工程目录
      - name: Build Debug APK
        run: |
         cd kotlin-tv
          ./gradlew assembleDebug --stacktrace

      # 上传apk，路径也要对应
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
