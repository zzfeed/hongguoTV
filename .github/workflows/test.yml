name: Build Android Debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # 配置JDK17，用来运行我们手动下载的gradle 7.5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 手动下载gradle 7.5，不用系统自带的gradle9！
      - name: Download Gradle 7.5
        run: |
          wget https://mirrors.aliyun.com/maven/gradle/gradle-7.5-all.zip
          unzip gradle-7.5-all.zip
          export GRADLE_HOME=$PWD/gradle-7.5
          export PATH=$GRADLE_HOME/bin:$PATH
          cd kotlin-tv
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew

      # 切换JDK11，项目编译用
      - name: Set up JDK 11 for build
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # 阿里云全局镜像
      - name: Aliyun mirror init script
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          pluginManagement {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      # 打包
      - name: Build Debug APK
        run: |
          cd kotlin-tv
          ./gradlew assembleDebug --stacktrace

      # 上传APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: kotlin-tv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
